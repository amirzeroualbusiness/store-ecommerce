<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="first">
    <div class="formulari">
      <br />
      <form id="formularios">
        <input
          type="text"
          required
          placeholder="Name"
          minlength="4"
          maxlength="10"
          id="texto"
        />
        <br /><br />
        <input
          type="password"
          required
          maxlength="11"
          placeholder="New Password"
          id="passw"
        />
        <br /><br />
        <input type="email" required id="correo" placeholder="user@gmail.com" />
        <br /><br />
        <input type="submit" id="acc" value="Create Account" />
      </form>
    </div>
  </body>
</html>
